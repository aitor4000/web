# Compila el sitio con Hugo y lo publica en GitHub Pages.
# Basado en el workflow oficial de Hugo para Pages (actions/starter-workflows),
# sin Dart Sass, Node ni submódulos, que este sitio no usa.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue cada vez; no se cancela el que está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Versión fijada. Regla: solo versiones con al menos 14 días publicadas.
      HUGO_VERSION: 0.168.0
      TZ: Europe/Madrid
    steps:
      - name: Instalar Hugo (versión fijada, SHA-256 verificado)
        run: |
          cd "${RUNNER_TEMP}"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tarball="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${tarball}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p hugo-bin
          tar -xzf "${tarball}" -C hugo-bin
          echo "${RUNNER_TEMP}/hugo-bin" >> "${GITHUB_PATH}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # historial completo: fechas de modificación reales desde git

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Compilar
        env:
          HUGO_ENVIRONMENT: production
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          hugo version
          hugo --gc --minify

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5

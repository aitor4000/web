id: charlando-con-la-ia
title: { es: "Charlando con la IA", en: "Charlando con la IA" }
subtitle:
  es: "Una guía práctica para el uso de asistentes de IA"
  en: "A practical guide to using AI assistants"
language: es
version: "1.0"
date_published: "2025-10"
free: true
license:
  name: "CC BY-NC 4.0"
  url: https://creativecommons.org/licenses/by-nc/4.0/
synopsis:
  es: "Guía práctica de prompting para asistentes de IA generalistas. Cada lección introduce un principio, lo demuestra con un ejemplo y propone una tarea práctica con un prompt de revisión. Incluye un prólogo sobre los principales asistentes, un glosario y un test final de diez ítems."
  en: "Practical guide to prompting general-purpose AI assistants. Each lesson introduces a principle, shows it with an example and sets a practical task with a review prompt. It includes a foreword on the main assistants, a glossary and a ten-item final test. The text is in Spanish."
